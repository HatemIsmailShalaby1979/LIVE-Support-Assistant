packages:
  - "apps/*"
  - "packages/*"

# onnxruntime-node downloads its native binaries in a postinstall script;
# protobufjs is pulled in by the ONNX toolchain. Both must be allowed to build.
allowBuilds:
  onnxruntime-node: true
  protobufjs: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.4'
  - '@turbo/darwin-arm64@2.11.4'
  - '@turbo/linux-64@2.11.4'
  - '@turbo/linux-arm64@2.11.4'
  - '@turbo/windows-64@2.11.4'
  - '@turbo/windows-arm64@2.11.4'
  - turbo@2.11.4
